name: Build & distribute Android (Firebase App Distribution)

# Runs on every push to main, and can also be triggered manually from the
# Actions tab (with an optional custom set of release notes).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for this build"
        required: false
        default: "Build automatique depuis GitHub Actions"

env:
  FIREBASE_APP_ID: "1:56734402863:android:8f12f08f8eff13a8e2b9da"
  FIREBASE_PROJECT_ID: "questbook-48540"

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            --groups "testeurs" \
            --release-notes "${{ github.event.inputs.release_notes || format('Build auto depuis commit {0}', github.sha) }}" \
            --token "$FIREBASE_TOKEN"

      - name: Clean up signing secrets from runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
